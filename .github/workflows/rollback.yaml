# Reusable Workflow: Rollback auf das vorige Release.
#
# Absichtlich ein eigener Workflow und nicht ein Schalter am Deploy: so kann er
# ein eigenes Environment mit eigenen Freigebern tragen und laesst sich nicht
# versehentlich mitausloesen. Zusaetzlich muss der Aufrufer bestaetigen.
name: artack ansistrano rollback

on:
  workflow_call:
    inputs:
      environment:
        description: Eigenes Environment fuer Rollbacks, z.B. prod-rollback - mit eigenen Freigebern.
        required: true
        type: string
      playbook:
        description: Rollback-Playbook, z.B. rollback_prod.yaml.
        required: true
        type: string
      confirm:
        description: Muss wortwoertlich ROLLBACK sein. Schutz gegen einen Fehlklick im Dispatch-Formular.
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: "."
      galaxy-requirements:
        required: false
        type: string
        default: "deployment/requirements.yml"
      ansible-version:
        required: false
        type: string
        default: "ansible-core~=2.16.14"
      runs-on:
        required: false
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        required: false
        type: number
        default: 20
      reference-playbook:
        description: Deploy-Playbook derselben Umgebung als Referenz. Leer = aus dem Namen abgeleitet (rollback_prod.yaml -> deploy_prod.yaml).
        required: false
        type: string
        default: ""
    secrets:
      ssh-private-key:
        required: true
      ssh-known-hosts:
        required: true

jobs:
  rollback:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: ${{ inputs.environment }}
    # Teilt die Gruppe mit dem Deploy-Workflow: ein Rollback darf nicht parallel
    # zu einem laufenden Deployment auf dieselbe Umgebung laufen.
    concurrency:
      group: artack-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Verify confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "${CONFIRM}" != "ROLLBACK" ]]; then
            echo "::error::Bestaetigung fehlt: confirm muss ROLLBACK sein (war: '${CONFIRM}')."
            exit 1
          fi

      # Rollback braucht nur die Playbooks und Hooks, nicht den deployten Ref -
      # darum der Default-Branch.
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout deploy action
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .artack-deploy
          persist-credentials: false

      - name: Rollback
        uses: ./.artack-deploy
        with:
          playbook: ${{ inputs.playbook }}
          # Kein git-ref: die Rollback-Playbooks haben kein vars_prompt.
          git-ref: ""
          working-directory: ${{ inputs.working-directory }}
          galaxy-requirements: ${{ inputs.galaxy-requirements }}
          ansible-version: ${{ inputs.ansible-version }}
          # Hier ist die Ziel-Pruefung der eigentliche Schutz - nicht abschaltbar.
          check-target: true
          reference-playbook: ${{ inputs.reference-playbook }}
          ssh-private-key: ${{ secrets.ssh-private-key }}
          ssh-known-hosts: ${{ secrets.ssh-known-hosts }}
