# Reusable Workflow: fuehrt ein Rollback-Playbook eines artack-Projekts aus.
#
# Eigener Workflow, nicht ein Schalter am Deploy: so kann er ein eigenes
# Environment mit eigenen Freigebern tragen und laesst sich nicht versehentlich
# mitausloesen. Zusaetzlich muss der Aufrufer bestaetigen.
#
# ACHTUNG: Die rollback_*.yaml mehrerer Projekte sind untailorierte
# dist-Vorlagen (hosts: all trifft alle Umgebungen, ansistrano_deploy_to zeigt
# auf einen Platzhalterpfad). Vor der ersten Nutzung pro Projekt pruefen und
# Sam vorlegen - der Baustein prueft das NICHT, er fuehrt aus, was dasteht.
name: artack ansible rollback

on:
  workflow_call:
    inputs:
      environment:
        description: Eigenes Environment fuer Rollbacks, z.B. prod-rollback - mit eigenen Freigebern.
        required: true
        type: string
      playbook:
        description: Pfad zum Rollback-Playbook, z.B. rollback_prod.yaml.
        required: true
        type: string
      confirm:
        description: Muss wortwoertlich ROLLBACK sein. Schutz gegen einen Fehlklick im Dispatch-Formular.
        required: true
        type: string
      ansible-version:
        required: false
        type: string
        default: "ansible~=9.13.0"
      galaxy-requirements-inline:
        required: false
        type: string
        default: ""
      galaxy-requirements:
        required: false
        type: string
        default: ""
      runs-on:
        required: false
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        required: false
        type: number
        default: 20

jobs:
  rollback:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: ${{ inputs.environment }}
    # Teilt die Gruppe mit dem Deploy-Workflow: ein Rollback darf nicht parallel
    # zu einem laufenden Deployment auf dieselbe Umgebung laufen.
    concurrency:
      group: artack-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Verify confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "${CONFIRM}" != "ROLLBACK" ]]; then
            echo "::error::Bestaetigung fehlt: confirm muss ROLLBACK sein (war: '${CONFIRM}')."
            exit 1
          fi

      # Rollback braucht die Playbooks und Hooks, nicht einen bestimmten Ref -
      # darum der Default-Branch.
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout deploy action
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .artack-deploy
          persist-credentials: false

      - name: Rollback
        uses: ./.artack-deploy
        with:
          playbook: ${{ inputs.playbook }}
          # Kein git-ref: die Rollback-Playbooks haben kein vars_prompt.
          git-ref: ""
          ansible-version: ${{ inputs.ansible-version }}
          galaxy-requirements-inline: ${{ inputs.galaxy-requirements-inline }}
          galaxy-requirements: ${{ inputs.galaxy-requirements }}
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
