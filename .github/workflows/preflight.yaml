# Reusable Workflow: Preflight ohne Serverkontakt und ohne Secrets.
#
# Deckt zwei Fehlerklassen auf, die sonst erst beim Deployment auffallen:
#   1. Submodul-Pin auf einen Commit, den das Remote nicht kennt (lokal
#      unauffaellig, solange das Arbeitsverzeichnis stimmt).
#   2. Playbook-Syntax und fehlende Galaxy-Rollen.
name: artack ansible preflight

on:
  workflow_call:
    inputs:
      playbook-glob:
        description: Welche Playbooks geprueft werden, relativ zum Repository-Wurzelverzeichnis.
        required: false
        type: string
        default: "deploy_*.yaml rollback_*.yaml"
      ansible-version:
        required: false
        type: string
        default: "ansible~=9.13.0"
      runs-on:
        required: false
        type: string
        default: "ubuntu-latest"

jobs:
  preflight:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install ansible
        if: inputs.ansible-version != ''
        env:
          ANSIBLE_VERSION: ${{ inputs.ansible-version }}
        run: |
          venv="${HOME}/.artack-ansible"
          python3 -m venv "${venv}"
          "${venv}/bin/pip" install --quiet --upgrade pip
          "${venv}/bin/pip" install --quiet "${ANSIBLE_VERSION}"
          "${venv}/bin/ansible" --version
          echo "${venv}/bin" >> "${GITHUB_PATH}"

      - name: Install roles
        run: |
          # Dieselben bekannt-guten Versionen wie im Deploy-Baustein.
          cat > /tmp/requirements.yml <<'EOF'
          - src: ansistrano.deploy
            version: 4.0.1
          - src: ansistrano.rollback
            version: 3.1.0
          - src: cbrunnkvist.ansistrano-symfony-deploy
            version: v1.4.1
          EOF
          ansible-galaxy install -r /tmp/requirements.yml

      - name: Syntax check
        env:
          PLAYBOOK_GLOB: ${{ inputs.playbook-glob }}
        run: |
          failed=0
          for playbook in ${PLAYBOOK_GLOB}; do
            # Ohne nullglob: ein nicht aufgeloester Glob wird uebersprungen.
            [ -e "${playbook}" ] || continue
            echo "::group::${playbook}"
            # git_branch wird gesetzt, damit das vars_prompt nicht greift.
            ansible-playbook "${playbook}" -e git_branch=preflight --syntax-check < /dev/null || failed=1
            echo "::endgroup::"
          done
          exit "${failed}"
