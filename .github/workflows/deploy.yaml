# Reusable Workflow: fuehrt ein Deploy-Playbook eines artack-Projekts aus.
#
# Warum es diesen Workflow gibt - und was er NICHT ist: Er fuegt keine
# Faehigkeit hinzu. `environment`, `concurrency` und `permissions` kann der Job
# eines Aufrufers genauso setzen, und Secret-WERTE gehen ohnehin als normale
# Inputs in die Action (die `secrets:`-Schnittstelle ist eine Bequemlichkeit,
# keine Voraussetzung). Wer die Action direkt einbindet, verliert nichts.
#
# Der Grund ist ein einziger, und er steht unten bei `concurrency`: Die
# Entscheidung `cancel-in-progress: false` ist hier einmal zentral richtig
# gesetzt, statt in jedem Projekt neu abgeschrieben zu werden. Sie ist die
# Sorte Detail, die beim Abschreiben verlorengeht und dann teuer wird.
#
# Der Aufrufer gibt den Playbook-Pfad an, sonst nichts. Alles Projektspezifische
# steht im Playbook selbst und wird hier nicht angefasst.
name: artack ansible deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment; traegt Freigabe-Regeln und die beiden Secrets.
        required: true
        type: string
      playbook:
        description: Pfad zum Playbook, z.B. deploy_stag.yaml. Sein Verzeichnis ist das Arbeitsverzeichnis.
        required: true
        type: string
      git-ref:
        description: Branch, Tag oder SHA, der deployt wird. Ein Tag ist einem Branch vorzuziehen - er bewegt sich nicht.
        required: true
        type: string
      ansible-version:
        required: false
        type: string
        default: "ansible~=9.13.0"
      galaxy-requirements-inline:
        description: Requirements-YAML als Text. Override; ohne Angabe gelten die eingebauten Versionen.
        required: false
        type: string
        default: ""
      galaxy-requirements:
        required: false
        type: string
        default: ""
      extra-vars:
        required: false
        type: string
        default: ""
      runs-on:
        required: false
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        required: false
        type: number
        default: 20

jobs:
  deploy:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: ${{ inputs.environment }}
    # Zwei Deployments auf dieselbe Umgebung duerfen sich nicht ueberholen.
    # cancel-in-progress bleibt aus: ein abgebrochenes Deployment ist schlimmer
    # als ein wartendes - es kann das Release verlinkt, die after_symlink-Hooks
    # (opcache, Messenger) aber nicht gelaufen hinterlassen.
    concurrency:
      group: artack-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Das Submodul deployment/ ist Pflicht: es liefert die Hooks, auf die die
      # Playbooks per playbook_dir verweisen.
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git-ref }}
          submodules: recursive
          persist-credentials: false

      # Der Baustein wird in genau der Fassung geholt, in der dieser Workflow
      # aufgerufen wurde - Workflow und Action koennen so nicht auseinanderlaufen.
      - name: Checkout deploy action
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .artack-deploy
          persist-credentials: false

      - name: Deploy
        uses: ./.artack-deploy
        with:
          playbook: ${{ inputs.playbook }}
          git-ref: ${{ inputs.git-ref }}
          ansible-version: ${{ inputs.ansible-version }}
          galaxy-requirements-inline: ${{ inputs.galaxy-requirements-inline }}
          galaxy-requirements: ${{ inputs.galaxy-requirements }}
          extra-vars: ${{ inputs.extra-vars }}
          # Direkt aus dem Environment dieses Jobs. NICHT vom Aufrufer
          # durchreichen: Ein Job, der einen Reusable Workflow aufruft, darf
          # kein `environment` setzen und sieht deshalb nur Repo- und
          # Org-Secrets. Der Aufrufer braucht dafuer `secrets: inherit`.
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment ${{ job.status }}"
            echo ""
            echo "| Feld | Wert |"
            echo "| --- | --- |"
            echo "| Umgebung | ${{ inputs.environment }} |"
            echo "| Playbook | ${{ inputs.playbook }} |"
            echo "| Ref | ${{ inputs.git-ref }} |"
            echo "| Ausgeloest von | ${{ github.actor }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
