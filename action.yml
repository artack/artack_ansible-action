name: artack Ansible Playbook
description: Fuehrt ein bestehendes Ansible-Playbook eines artack-Projekts in der CI aus. Fuer Deployments den Reusable Workflow bevorzugen - nur der kann environment und concurrency setzen.
inputs:
  playbook:
    description: Pfad zum Playbook im Repository, z.B. deploy_stag.yaml oder deployment/deploy_stag.yaml. Sein Verzeichnis ist das Arbeitsverzeichnis - dort liegen ansible.cfg und hosts.yaml.
    required: true
  git-ref:
    description: Branch, Tag oder SHA, der deployt wird. Wird als "-e git_branch=<ref>" gesetzt und umgeht damit das vars_prompt der Playbooks. Fuer Playbooks ohne vars_prompt (Rollback) leer lassen.
    required: false
    default: ""
  ssh-private-key:
    description: Privater Deploy-Schluessel. Immer aus einem Secret speisen, nie literal.
    required: true
  ssh-known-hosts:
    description: known_hosts-Eintrag des Zielservers (Ausgabe von ssh-keyscan). Pflicht - es wird kein StrictHostKeyChecking=no verwendet.
    required: true
  ansible-version:
    description: "pip-Spezifikation. Default ist die volle ansible-Distribution statt ansible-core - die Playbooks und Hooks benutzen Module aus community.general (z.B. htpasswd), und ansible-core bringt keine Collections mit. Leer = vorinstalliertes nehmen."
    required: false
    default: "ansible~=9.13.0"
  galaxy-requirements-inline:
    description: Requirements-YAML als Text. Override fuer Ausnahmen; ohne Angabe gelten die eingebauten, bekannt-guten Versionen.
    required: false
    default: ""
  galaxy-requirements:
    description: Pfad zu einer Requirements-Datei. Nur setzen, wenn sie Versionen pinnt - eine ungepinnte Datei zieht die neuesten Rollen, und daran brechen artack-Playbooks.
    required: false
    default: ""
  extra-vars:
    description: Zusaetzliche Ansible-Variablen als key=value (eine Zeichenkette, wird als weiteres -e uebergeben).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install ansible
      if: inputs.ansible-version != ''
      shell: bash
      env:
        ANSIBLE_VERSION: ${{ inputs.ansible-version }}
      run: |
        # Eigene venv im Runner-Home statt pipx. Zwei Sackgassen davor, beide
        # gemessen: `pipx install <pin>` meldet "already seems to be installed"
        # und laesst die vorinstallierte Version stehen, der Pin ist dann still
        # unwirksam; `pipx install --force` scheitert mit "Operation not
        # permitted", weil /opt/pipx/venvs root gehoert.
        venv="${HOME}/.artack-ansible"
        python3 -m venv "${venv}"
        "${venv}/bin/pip" install --quiet --upgrade pip
        "${venv}/bin/pip" install --quiet "${ANSIBLE_VERSION}"
        # GITHUB_PATH greift erst im naechsten Schritt, darum hier absolut.
        "${venv}/bin/ansible" --version
        echo "${venv}/bin" >> "${GITHUB_PATH}"

    - name: Run playbook
      shell: bash
      env:
        # Die Geheimnisse gehen ueber die Umgebung, nicht ueber die
        # Kommandozeile: eine Interpolation im run-Body wuerde sie in das
        # Shell-Skript auf der Platte schreiben.
        ARTACK_SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        ARTACK_SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        ARTACK_GALAXY_REQUIREMENTS_INLINE: ${{ inputs.galaxy-requirements-inline }}
      run: |
        "${GITHUB_ACTION_PATH}/src/run-playbook.sh" \
          "${{ inputs.playbook }}" \
          "${{ inputs.git-ref }}" \
          "${{ inputs.galaxy-requirements }}" \
          "${{ inputs.extra-vars }}"
