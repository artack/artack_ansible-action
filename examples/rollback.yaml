# Kommt so in ein Projekt: .github/workflows/rollback.yaml
#
# Erst einlegen, wenn das rollback_*.yaml des Projekts geprueft und tailoriert
# ist - mehrere Projekte tragen dort noch die dist-Vorlage mit `hosts: all`.
name: rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [stag, prod]
      confirm:
        description: Zur Bestaetigung ROLLBACK eintippen
        required: true
        type: string

jobs:
  rollback:
    uses: artack/artack_ansible-action/.github/workflows/rollback.yaml@<tag-oder-sha>
    with:
      # Eigenes Environment, damit Rollbacks eigene Freigeber haben koennen.
      environment: ${{ inputs.environment }}-rollback
      playbook: rollback_${{ inputs.environment }}.yaml
      confirm: ${{ inputs.confirm }}
    secrets: inherit
