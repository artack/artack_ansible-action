# Kommt so in ein Projekt: .github/workflows/deploy.yaml
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Zielumgebung
        required: true
        type: choice
        options: [stag, prod]
      git-ref:
        description: Branch, Tag oder SHA
        required: true
        type: string

jobs:
  deploy:
    uses: artack/artack_ansible-action/.github/workflows/deploy.yaml@v0.3.0
    with:
      environment: ${{ inputs.environment }}
      playbook: deploy_${{ inputs.environment }}.yaml
      git-ref: ${{ inputs.git-ref }}
    # secrets: inherit ist Pflicht. Ein Reusable Workflow bekommt NUR, was der
    # Aufrufer ihm uebergibt - es gibt keinen impliziten Zugriff auf dessen
    # Secret-Speicher. `inherit` fuellt den Kontext, das environment im Baustein
    # zieht dann die Environment-Secrets in den Scope. Ohne diese Zeile sind sie
    # leer und der Lauf bricht ab (im Pilotlauf 1 am 2026-09-04 passiert).
    secrets: inherit
