# Kommt so in ein Projekt: .github/workflows/deploy.yaml
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [stag, prod]
      git-ref:
        required: true
        type: string

jobs:
  deploy:
    uses: artack/artack_ansible-action/.github/workflows/deploy.yaml@<tag-oder-sha>
    with:
      environment: ${{ inputs.environment }}
      playbook: deploy_${{ inputs.environment }}.yaml
      git-ref: ${{ inputs.git-ref }}
    # Pflicht. Ein Reusable Workflow bekommt nur, was der Aufrufer uebergibt;
    # `inherit` fuellt den Kontext, das environment im Baustein zieht dann die
    # Environment-Secrets in den Scope. Ohne die Zeile sind sie leer.
    secrets: inherit
